name: Reminders cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/reminders
        env:
          # Адрес не секрет — он публичный. В секретах он раньше был пустым,
          # и curl молча падал на "No host part in the URL" месяцами.
          APP_URL: https://mar-os-gamma.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Секрет CRON_SECRET не задан в настройках репозитория"
            exit 1
          fi

          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            -X POST "$APP_URL/api/cron/reminders" \
            -H "x-cron-secret: $CRON_SECRET")

          echo "HTTP $code"

          # Тело ответа может содержать ID канала-БД. Репозиторий публичный,
          # а значит и логи тоже — поэтому печатаем только по явному включению:
          # Settings → Secrets and variables → Actions → Variables → DEBUG_CRON=1.
          # Не забудь выключить после разбора.
          if [ "${{ vars.DEBUG_CRON }}" = "1" ]; then
            cat /tmp/out.txt
          fi

          case "$code" in
            200) echo "::notice::Напоминания разосланы" ;;
            401) echo "::error::401 — CRON_SECRET в GitHub и в Vercel не совпадают"; exit 1 ;;
            *)   echo "::error::Неожиданный ответ $code"; exit 1 ;;
          esac
